name: Release

# Pushing a tag such as v0.2.0 builds, tests, packs the library and the CLI tool with
# that version, pushes both to NuGet, and attaches the packages to a GitHub release.
# Requires the NUGET_API_KEY repository secret.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Version from tag
      id: version
      run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: >
        dotnet build --no-restore --configuration Release
        -p:Version=${{ steps.version.outputs.value }}
        -p:ContinuousIntegrationBuild=true

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Pack
      run: |
        dotnet pack SteganoLib/SteganoLib.csproj --no-build --configuration Release -p:Version=${{ steps.version.outputs.value }} --output packages
        dotnet pack SteganoLib.Cli/SteganoLib.Cli.csproj --no-build --configuration Release -p:Version=${{ steps.version.outputs.value }} --output packages

    - name: Push to NuGet
      run: >
        dotnet nuget push "packages/*.nupkg"
        --api-key ${{ secrets.NUGET_API_KEY }}
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate

    - name: GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: packages/*
        generate_release_notes: true
